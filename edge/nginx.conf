# Host-facing edge for the scaled finforge-api service.
# The zero-downtime deploy replaces api containers (new IPs each rollout), so
# proxy via Docker's embedded DNS with a short TTL instead of a static upstream.
server {
    listen 8000;

    location / {
        resolver 127.0.0.11 valid=5s;
        set $upstream http://finforge-api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
