version: "3.9"

networks:
  finforge-net:
    driver: bridge
  docker-services_default:
    external: true

services:
  finforge-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./api:/app
      - ./secrets:/secrets
    networks:
      - finforge-net
      - docker-services_default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health", "-H", "X-API-Key: ${API_KEY}"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  # Publishes the API on the host for local consumers (natebot's briefing
  # calls hit http://localhost:8001). The api service itself can't publish a
  # host port because the zero-downtime deploy scales it to 2 replicas.
  finforge-edge:
    image: nginx:alpine
    container_name: finforge-edge
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - finforge-api
    networks:
      - finforge-net
    restart: unless-stopped

  finforge-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_API_KEY: ${API_KEY}
    depends_on:
      - finforge-api
    networks:
      - finforge-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  finforge-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: finforge-tunnel
    command: tunnel --no-autoupdate run
    env_file:
      - .env
    depends_on:
      - finforge-api
    networks:
      - finforge-net
    restart: unless-stopped

  finforge-cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    container_name: finforge-cron
    env_file:
      - .env
    volumes:
      - ./secrets:/secrets
    depends_on:
      - finforge-api
    networks:
      - finforge-net
      - docker-services_default
    restart: unless-stopped
